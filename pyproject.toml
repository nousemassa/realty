[project]
name = "realty-agent"
version = "0.1.0"
description = "Продукт realty: запись на просмотры, брони, объявления и граф напоминаний"
requires-python = ">=3.11"
dependencies = [
    #: Общий слой — отдельная распространяемая единица (`core/`), ставится колёсом.
    "agent-core==0.18.0",
    # HTTP-процессы продукта (мост, граф, MCP-листенер)
    # Нижняя граница поднята осознанно: встроенная телеметрия FastAPI настраивается
    # через `FastAPI(telemetry=…)` (её читает `agent_core.telemetry.fastapi_telemetry`).
    # На 0.115 этого аргумента нет ⇒ пуск упал бы `TypeError`.
    "fastapi>=0.143",
    "uvicorn[standard]>=0.30",
    #: ❗ `python-multipart` нужен FastAPI для загрузки файлов (фото в объявлении). Прямого импорта нет —
    #: зависимость рантайма, и без неё ручка объявлений падает при ЗАПРОСЕ, а не при старте.
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.8",
    # MCP-листенер продукта (инструменты для агента)
    "fastmcp>=4.1",
    # Telegram: транспорт MTProto (механика в общем слое)
    "telethon>=1.45",
    # граф напоминаний: состояние живёт днями, есть прерывание на человека и циклы с ограничением
    "langgraph>=1.2",
    #: Чекпойнтер графа ходит через `psycopg` (а мост — через `asyncpg`), поэтому оба драйвера рядом,
    #: и это названо, а не спрятано.
    "langgraph-checkpoint-postgres>=3.1",
    "psycopg[binary,pool]>=3.3",
    # зрение: фото в объявлении (пережатие перед отправкой)
    "pillow>=10.4",
    "pillow-heif>=0.18",
    #: ❗ `sqlalchemy` и `alembic` объявлялись прежде, но НЕ используются ничем (разбор импортов по
    #: продукту и общему слою: 0 файлов). Убраны: объявленная, но неиспользуемая зависимость — это
    #: ложное утверждение о проекте и лишний вес образа. Вернуть — когда появится настоящий импорт.
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["realty_agent*"]

[tool.pytest.ini_options]
#: ❗ Обязательно в СВОЁМ файле: корневой `pytest.ini` воркспейса при отдельном репозитории не
#: читается, а без `auto` падают ВСЕ асинхронные тесты (их большинство), причём ошибкой, которая
#: выглядит как «тесты сломались», а не «конфигурация уехала».
asyncio_mode = "auto"
#: Маркер объявлен здесь же: незарегистрированный маркер даёт предупреждение на каждом прогоне. Сейчас
#: им не помечен ни один тест — живые пропускает фикстура `bridge_test_dsn` (нет базы ⇒ `skip`,
#: `AGENT_LIVE_STRICT=1` ⇒ отказ).
markers = ["live: требует поднятый стенд и настоящие токены (пока не используется: живые тесты пропускает фикстура)"]
