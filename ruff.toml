# Правила линтера проекта `realty`.
#
# **Почему свой файл.** Ruff ищет настройки ВВЕРХ по дереву: без файла в репозитории он взял бы умолчания
# (другая длина строки, другой набор правил — `B008` вдруг стал бы нарушением).
#
#: B008 (вызов функции в значении по умолчанию) — это идиома FastAPI: `File(...)`, `Depends(...)`,
#: `Query(...)` в сигнатуре и есть способ объявить параметр. Правило здесь даёт ложное срабатывание.
#: Свой код: общий слой и пакеты проектов. Иначе линтер считал бы установленный `agent_core` сторонним
#: пакетом и требовал отделять его пустой строкой (см. `0024`).
line-length = 110
target-version = "py311"

[lint]
#: B008 (вызов функции в значении по умолчанию) — это идиома FastAPI: `File(...)`, `Depends(...)`,
#: `Query(...)` в сигнатуре и есть способ объявить параметр. Правило здесь даёт ложное срабатывание.
ignore = ["B008"]

[lint.isort]
#: Свой код: общий слой и пакеты проектов. Иначе линтер считал бы установленный `agent_core` сторонним
#: пакетом и требовал отделять его пустой строкой (см. `0024`).
known-first-party = ["agent_core", "realty_agent"]
